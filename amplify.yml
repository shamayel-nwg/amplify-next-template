version: 1
backend:
  phases:
    build:
      commands:
        - echo "Testing S3 buckets access"
        - aws s3 ls
        - echo "Testing S3 bucket access"
        - aws s3 ls s3://cdk-hnb659fds-assets-481665082761-eu-west-1
        - echo "Building Application"
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
