version: 1
backend:
  phases:
    build:
      commands:
        - echo "Checking Role"
        - aws sts get-caller-identity
        - echo "Testing S3 bucket access - list"
        - aws s3 ls s3://cdk-hnb659fds-assets-481665082761-eu-west-1
        # - echo "Testing S3 bucket access - write"
        # - echo "This is a test file created at runtime." > /tmp/test-file.txt
        # - aws s3 cp /tmp/test-file.txt s3://cdk-hnb659fds-assets-481665082761-eu-west-1/path/in/bucket/test-file.txt
        # - echo "This is a test file created at runtime. - gzip" > /tmp/test-file.gzip
        # - aws s3 cp /tmp/test-file.txt s3://cdk-hnb659fds-assets-481665082761-eu-west-1/path/in/bucket/test-file.gzip
        - echo "Building Application"
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
